[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "am-alphagozero"
version = "0.1.0"
description = "MCTS-Guided Policy Improvement for Combinatorial Optimization (AM + AlphaGo Zero)"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "modal>=1.3.0",
    "numpy",
    "pybind11>=2.11",
    "scipy",
    "torch",
    "tqdm",
    "wandb>=0.18.0",
]

[project.optional-dependencies]
tensorboard = ["tensorboard"]

[tool.setuptools.packages.find]
where = ["src"]

# uv configuration: fetch Linux torch wheels from the cu124 index so Modal
# containers (Linux + GPU) get the right binaries; non-Linux (local Windows
# / Mac dev) falls through to the default PyPI index where torch resolves
# to the CPU build. Cross-platform lockfile generation is handled
# automatically by uv via resolution-markers.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
